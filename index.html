<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e8455f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dhaaga</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: #f4ece2;
      background: radial-gradient(120% 80% at 20% 0%, #2a1b3d 0%, #1a1430 45%, #0d0b1f 100%); min-height: 100vh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 22px 18px 40px; }
    h1 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; font-size: 30px; }
    .sub { opacity: .65; font-size: 12.5px; margin-top: -2px; }
    input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06); color: #fff; font-size: 16px; }
    .skies { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .sky { border-radius: 20px; padding: 15px 14px; border: 1px solid rgba(255,255,255,.12); }
    .awake { background: linear-gradient(160deg,#ffb86b,#ff7e5f); }
    .asleep { background: linear-gradient(160deg,#2c2350,#171336); }
    .time { font-family: 'Fraunces',serif; font-size: 32px; margin-top: 6px; line-height: 1; }
    #map { height: 200px; border-radius: 20px; margin: 4px 0 16px; border: 1px solid rgba(255,255,255,.12); }
    .buzz { width: 116px; height: 116px; border-radius: 50%; border: none; cursor: pointer; color: #fff;
      background: radial-gradient(circle at 35% 30%, #ff9a76, #e8455f); box-shadow: 0 12px 40px rgba(232,69,95,.45);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: inherit; }
    .pings { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 16px 0; }
    .ping { padding: 12px; border-radius: 13px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      color: #f4ece2; font-size: 13.5px; cursor: pointer; font: inherit; }
    .btn { padding: 15px; border-radius: 14px; border: none; cursor: pointer; width: 100%;
      background: radial-gradient(circle at 35% 30%, #ff9a76, #e8455f); color: #fff; font-size: 16px; font-weight: 700; }
    .role { padding: 14px; border-radius: 14px; cursor: pointer; color: #fff; text-align: center; font: inherit; }
    .pill { font-size: 11px; opacity: .7; }
    @keyframes ring { 0%{transform:scale(.6);opacity:.9} 100%{transform:scale(2.4);opacity:0} }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
